name: Compatibility and stability gates
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 18 * * *'
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-24.04]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        if: runner.os != 'Windows'
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      # Install Electron once before parallel tests can trigger its lazy download.
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - run: node scripts/fix-whisper-addon.js
        if: runner.os == 'Windows'
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux' && matrix.node == 22
      - run: npm test -- --run
      - run: npm run build
      - name: Repeat recovery-critical tests
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run test:stability
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test extension/tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==2.4.6
      - name: Native bridge regression tests (no model download)
        run: python -m unittest discover -s extension/desktop -p 'test_*.py'
