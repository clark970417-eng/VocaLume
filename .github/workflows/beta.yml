name: Build public beta

on:
  workflow_dispatch:
  push:
    tags: ["beta-v*"]

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extension:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release versions
        run: |
          if test "${GITHUB_REF_TYPE}" = tag; then
            node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-release-version.mjs
          fi
      - run: node --test extension/tests/*.test.mjs
      - name: Package Chromium extension
        run: |
          mkdir -p beta
          cd extension
          zip -r ../beta/vocalume-extension.zip \
            manifest.json background.js offscreen.html offscreen.js audio-worklet.js \
            speech-worker.js vad-worker.js whisper-runtime.js desktop-worker.js native-client.mjs \
            cloud-api.mjs capture-status.mjs ui-language.mjs ui-messages.mjs ui-messages-zh-cn.mjs ui-messages-ja.mjs ui-messages-ko.mjs ui-messages-desktop-ja.mjs ui-messages-desktop-ko.mjs website-language.mjs website-language-content.js page-language.js popup-locale.mjs cue-cursor.mjs recording-queue.mjs streaming.mjs sentence-boundary.mjs stream-core.mjs token-stream.mjs preview-budget.mjs \
            translation-policy.mjs translation-guards.js translation-guards.mjs game-vocabulary.mjs streamer-vocabulary.js streamer-vocabulary.mjs popup.html popup.js popup.css content.js content.css \
            x-content.js x-content.css social-content.js social-content.css \
            caption-window.js caption-window.css icons vendor ort \
            desktop/install.py desktop/relay.py desktop/host.py desktop/translation_support.py \
            desktop/install-windows.ps1 desktop/windows-host.cjs \
            desktop/requirements.txt desktop/LIVE_TRANSLATE_LICENSE
          cd ..
          node scripts/package-guides.mjs beta
          cd beta
          zip vocalume-extension.zip INSTALL.md PRIVACY.md THIRD_PARTY_NOTICES.md LICENSE
          rm INSTALL.md PRIVACY.md THIRD_PARTY_NOTICES.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: beta/vocalume-extension.zip

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            command: npx electron-builder --mac dmg zip --arm64 --publish never --config.mac.identity=-
            artifact: macOS-Apple-Silicon
            mac_app: dist/mac-arm64/VocaLume.app
            files: |
              desktop-app/dist/*.dmg
              desktop-app/dist/*-mac.zip
          - os: macos-15-intel
            command: npx electron-builder --mac dmg zip --x64 --publish never --config.mac.identity=-
            artifact: macOS-Intel
            mac_app: dist/mac/VocaLume.app
            files: |
              desktop-app/dist/*.dmg
              desktop-app/dist/*-mac.zip
          - os: windows-2025
            command: npx electron-builder --win nsis --x64 --publish never
            artifact: Windows
            files: desktop-app/dist/*.exe
          - os: ubuntu-24.04
            command: npx electron-builder --linux AppImage --x64 --publish never
            artifact: Linux
            files: desktop-app/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        if: runner.os != 'Windows'
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      - run: node node_modules/electron/install.js
        if: runner.os == 'Windows'
      - run: node scripts/fix-whisper-addon.js
        if: runner.os == 'Windows'
      - name: Exclude unsupported Windows virtual microphone backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force node_modules/naudiodon -ErrorAction SilentlyContinue
      - name: Reject vulnerable dependency lockfiles
        run: npm audit --audit-level=moderate
      - name: Verify patched packaging dependencies
        run: node scripts/verify-packaging-toolchain.cjs
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm test -- --run
      - name: Build the Intel Mac speech engine
        if: matrix.os == 'macos-15-intel'
        run: node scripts/rebuild-whisper-mac-x64.cjs
      - run: npm run build
      - name: Build unsigned beta package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}
      - name: Verify Mac package contents
        if: runner.os == 'macOS'
        env:
          MAC_APP: ${{ matrix.mac_app }}
        run: node scripts/verify-mac-package.cjs "$MAC_APP"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/beta-v')
    needs: [extension, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: beta
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd beta
          find . -maxdepth 1 -type f -name '* *' -print0 | while IFS= read -r -d '' file; do
            mv "$file" "${file// /.}"
          done
          cd ..
          node scripts/verify-release-assets.mjs beta "${GITHUB_REF_NAME}" "${GITHUB_SHA}" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          VERSION="${GITHUB_REF_NAME#beta-v}"
          if test -f "docs/releases/${VERSION}.md"; then
            cp "docs/releases/${VERSION}.md" beta-notes.md
          else
            cat > beta-notes.md <<EOF
          Public preview build. Read the [installation and testing guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/beta-testing.md) before installation.

          Verify downloads with \`SHA256SUMS.txt\`. These packages are not code-signed, so the operating system will show a security warning. Report results through the repository issue forms.
          EOF
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" --jq .body > generated-notes.md
          printf '\n## Changes\n\n' >> beta-notes.md
          cat generated-notes.md >> beta-notes.md
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" beta/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --prerelease --notes-file beta-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" beta/* \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --title "VocaLume ${VERSION} — Public Beta" \
              --notes-file beta-notes.md
          fi
