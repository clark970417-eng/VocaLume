name: Build public beta

on:
  workflow_dispatch:
  push:
    tags: ["beta-v*"]

permissions:
  contents: write

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extension:
    if: github.ref != 'refs/heads/codex/windows-4.6.6-haas'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify release versions
        run: |
          if test "${GITHUB_REF_TYPE}" = tag; then
            node scripts/check-release-version.mjs "${GITHUB_REF_NAME}"
          else
            node scripts/check-release-version.mjs
          fi
      - run: node --test extension/tests/*.test.mjs
      - name: Package Chromium extension
        run: |
          mkdir -p beta
          cd extension
          zip -r ../beta/vocalume-extension.zip \
            manifest.json background.js offscreen.html offscreen.js audio-worklet.js \
            speech-worker.js vad-worker.js whisper-runtime.js desktop-worker.js native-client.mjs ui-language-sync.mjs youtube-source.js youtube-cue.mjs \
            cloud-api.mjs capture-status.mjs ui-language.mjs ui-messages.mjs ui-messages-zh-cn.mjs ui-messages-ja.mjs ui-messages-ko.mjs ui-messages-desktop-ja.mjs ui-messages-desktop-ko.mjs website-language.mjs website-language-content.js page-language.js popup-locale.mjs cue-cursor.mjs recording-queue.mjs streaming.mjs sentence-boundary.mjs stream-core.mjs token-stream.mjs preview-budget.mjs \
            translation-policy.mjs semantic-validation.mjs taiwan-chinese.mjs public-google.mjs translation-guards.js translation-guards.mjs game-vocabulary.mjs streamer-vocabulary.js streamer-vocabulary.mjs dom-changes.js popup.html popup.js popup.css content.js content.css \
            x-content.js x-content.css social-content.js social-content.css \
            caption-window.js caption-window.css icons vendor/silero ort \
            vendor/opencc/cn2t.mjs vendor/opencc/LICENSE vendor/opencc/THIRD_PARTY_LICENSES.md \
            desktop/install.py desktop/relay.py desktop/host.py desktop/translation_support.py \
            desktop/install-windows.ps1 desktop/windows-host.cjs desktop/install-mac.cjs desktop/capture-lease.mjs \
            desktop/requirements.txt desktop/LIVE_TRANSLATE_LICENSE
          cd ..
          node scripts/package-guides.mjs beta
          cd beta
          zip vocalume-extension.zip INSTALL.md PRIVACY.md THIRD_PARTY_NOTICES.md LICENSE
          rm INSTALL.md PRIVACY.md THIRD_PARTY_NOTICES.md LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension
          path: beta/vocalume-extension.zip
      - name: Package Windows Chromium extension
        run: python3 scripts/package-windows-extension.py beta/vocalume-extension.zip beta/vocalume-extension-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-Windows
          path: beta/vocalume-extension-windows.zip
          if-no-files-found: error

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            command: npx electron-builder --win nsis --x64 --publish never
            artifact: Windows
            files: desktop-app/dist/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - run: npm ci
        if: runner.os != 'Windows'
      - run: npm ci --ignore-scripts
        if: runner.os == 'Windows'
      # Install Electron once before parallel tests can trigger its lazy download.
      - name: Install Electron binary
        run: node node_modules/electron/install.js
      - name: Install FFmpeg for Windows file translation
        if: runner.os == 'Windows'
        run: node node_modules/ffmpeg-static/install.js
      - run: node scripts/fix-whisper-addon.js
        if: runner.os == 'Windows'
      - name: Exclude unsupported Windows virtual microphone backend
        if: runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Recurse -Force node_modules/naudiodon -ErrorAction SilentlyContinue
      - name: Reject vulnerable dependency lockfiles
        run: npm audit --audit-level=moderate
      - name: Verify patched packaging dependencies
        run: node scripts/verify-packaging-toolchain.cjs
      - run: npm run typecheck
      - run: npm run lint
        if: runner.os == 'Linux'
      - run: npm test -- --run
      - name: Build the Intel Mac speech engine
        if: matrix.os == 'macos-15-intel'
        run: node scripts/rebuild-whisper-mac-x64.cjs
      - name: Prepare bundled Haas-ja Q8_0 for Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/prepare-haas-windows.ps1
      - run: npm run build
      - name: Build unsigned beta package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.command }}
      - name: Verify packaged Windows runtime
        if: runner.os == 'Windows'
        run: node scripts/verify-windows-package.cjs dist/win-unpacked
      - name: Verify Mac package contents and native browser transport
        if: runner.os == 'macOS'
        env:
          MAC_APP: ${{ matrix.mac_app }}
        run: |
          node scripts/verify-mac-package.cjs "$MAC_APP"
          node scripts/verify-mac-companion.cjs "$MAC_APP"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/beta-v')
    needs: [extension, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: beta
          merge-multiple: true
      - name: Prepare prerelease draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd beta
          find . -maxdepth 1 -type f -name '* *' -print0 | while IFS= read -r -d '' file; do
            mv "$file" "${file// /.}"
          done
          cd ..
          node scripts/verify-release-assets.mjs beta "${GITHUB_REF_NAME}" "$(git rev-parse HEAD)" \
            "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          VERSION="${GITHUB_REF_NAME#beta-v}"
          if test -f "docs/releases/${VERSION}.md"; then
            cp "docs/releases/${VERSION}.md" beta-notes.md
          else
            cat > beta-notes.md <<EOF
          Public preview build. Read the [installation and testing guide](https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/beta-testing.md) before installation.

          Verify downloads with \`SHA256SUMS.txt\`. These packages are not code-signed, so the operating system will show a security warning. Report results through the repository issue forms.
          EOF
          fi
          if DRAFT=$(gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft); then
            test "$DRAFT" = true || { echo 'The prerelease has already been published.' >&2; exit 1; }
            gh release upload "${GITHUB_REF_NAME}" beta/* --repo "${GITHUB_REPOSITORY}" --clobber
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --prerelease --notes-file beta-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" beta/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag --draft --prerelease \
              --title "VocaLume ${VERSION} — Public Beta" \
              --notes-file beta-notes.md
          fi


  refresh-windows-haas:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/windows-4.6.6-haas'
    needs: [desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-Windows
          path: refresh
      - name: Refresh the Windows 4.6.6 installer and release metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd refresh
          tag=beta-v4.6.6
          installer=VocaLume.Setup.4.6.6.exe
          mv 'VocaLume Setup 4.6.6.exe' "$installer"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body,isDraft,isPrerelease > release.json
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" -p release-manifest.json -p SHA256SUMS.txt
          python3 - <<'PYTHON'
          import hashlib, json, os, re
          from datetime import datetime, timezone
          from pathlib import Path
          def sha256(path):
              with open(path, 'rb') as file:
                  return hashlib.file_digest(file, 'sha256').hexdigest()
          installer = 'VocaLume.Setup.4.6.6.exe'
          release = json.loads(Path('release.json').read_text())
          if release['isDraft'] or not release['isPrerelease']:
              raise SystemExit('Expected the public 4.6.6 beta release')
          manifest_file = Path('release-manifest.json')
          manifest = json.loads(manifest_file.read_text())
          if manifest['version'] != '4.6.6' or installer not in manifest['assets']:
              raise SystemExit('Unexpected Windows release manifest')
          checksums_file = Path('SHA256SUMS.txt')
          checksums = dict(line.split('  ', 1)[::-1] for line in checksums_file.read_text().splitlines() if line)
          if checksums.get('release-manifest.json') != sha256(manifest_file):
              raise SystemExit('Existing release manifest checksum mismatch')
          commit = os.environ['GITHUB_SHA']
          workflow = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          manifest.setdefault('assetBuilds', {})[installer] = {
              'commit': commit, 'workflow': workflow,
              'builtAt': datetime.now(timezone.utc).isoformat(), 'haasJa': 'Q8_0',
          }
          manifest_file.write_text(json.dumps(manifest, indent=2) + '\n')
          for name in (installer, 'release-manifest.json'):
              checksums[name] = sha256(name)
          checksums_file.write_text(''.join(f'{digest}  {name}\n' for name, digest in sorted(checksums.items())))
          replacement = ('- The Windows x64 installer includes Haas-ja Q8_0 and its runtime. '
                         'The app uses Haas-ja by default for Japanese speech recognition, with no separate installation. '
                         'SenseVoice remains available as a manual choice.')
          body, replacements = re.subn(r'^- Windows x64 supports Haas-ja Q8_0[^\r\n]*', replacement, release['body'], flags=re.M)
          if replacements != 1 and replacement not in body:
              raise SystemExit('Review the current English Haas-ja paragraph before updating the release')
          note = f'[Windows installer build]({workflow})'
          if note not in body:
              body = body.rstrip() + '\n\n' + note + '\n'
          Path('notes.md').write_text(body, encoding='utf-8')
          PYTHON
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber "$installer" release-manifest.json SHA256SUMS.txt
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
