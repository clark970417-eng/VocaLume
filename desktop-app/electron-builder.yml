appId: org.jtl.desktop
productName: VocaLume
directories:
  buildResources: build
extraResources:
  - from: '../LICENSE'
    to: 'legal/VOCALUME-LICENSE.txt'
  - from: 'LICENSE'
    to: 'legal/UPSTREAM-MIT-LICENSE.txt'
  - from: '../docs/legal/third-party-notices.md'
    to: 'legal/THIRD_PARTY_NOTICES.md'
  - from: '../extension/vendor/silero/LICENSE'
    to: 'legal/SILERO-VAD-ISC-MIT.txt'
  - from: 'resources/'
    to: 'bridge-scripts/'
    filter:
      - '*.py'
      - 'bin/**'
      - '!ane-translate-bridge.py'
      - '!mlx-whisper-bridge.py'
      - '!bin/{fluid-audio-bridge,voice-tone-helper,capture-claim-helper}'
asarUnpack:
  - 'node_modules/ffmpeg-static/**'
  - 'node_modules/@kutalia/whisper-node-addon/**'
  - 'node_modules/node-llama-cpp/**'
  - 'node_modules/sherpa-onnx*/**'
  - 'out/renderer/vad/**'
publish:
  provider: github
  owner: clark970417-eng
  repo: VocaLume
mac:
  icon: build/icon.icns
  extraResources:
    - &appleBridgeResources
      from: 'resources/'
      to: 'bridge-scripts/'
      filter:
        - 'ane-translate-bridge.py'
        - 'mlx-whisper-bridge.py'
        - 'bin/{fluid-audio-bridge,voice-tone-helper,capture-claim-helper}'
  files:
    # Keep the application allowlist in the same matcher as native exclusions.
    # A separate exclusions-only matcher implicitly includes the workspace.
    - &compiledApp 'out/**/*'
    - &appManifest 'package.json'
    - &excludeBenchScripts '!out/main/{benchmark,verify,soak}-*.cjs'
    - &excludeBenchOutput '!out/{benchmark-*,speech-benchmark-*}/**'
    - &excludeDevOutput '!out/**/*.{test.*,spec.*,tsbuildinfo,d.ts,d.ts.map}'
    # The native loaders use the runtime OS and architecture. Keep the
    # matching Whisper directory and its darwin alias.
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/{linux,win32}{,/**/*}'
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/darwin/!(${arch}){,/**/*}'
    - '!**/node_modules/@kutalia/whisper-node-addon/dist/{linux-*,win-*,win32-*}{,/**/*}'
    - '!**/node_modules/@kutalia/whisper-node-addon/dist/{darwin,mac}-!(${arch}){,/**/*}'
    # The renderer already bundles its WASM VAD runtime. Transformers and
    # Kokoro resolve their Node builds, which use the native ONNX binding.
    - '!**/node_modules/{onnxruntime-web,flatbuffers,guid-typescript,platform,protobufjs,long}{,/**/*}'
    - '!**/node_modules/@huggingface/transformers/{src,types}{,/**/*}'
    - '!**/node_modules/@huggingface/transformers/dist/!(transformers.node.mjs|transformers.node.cjs){,/**/*}'
    - '!**/node_modules/kokoro-js/types{,/**/*}'
    - '!**/node_modules/kokoro-js/dist/kokoro.web.js'
    # Packaged Electron uses the prebuilt llama bindings, not a source build.
    - '!**/node_modules/node-llama-cpp/llama/gitRelease.bundle'
    # Keep the compiled PortAudio binding and its adjacent library, not
    # the upstream build inputs, examples, or other platforms' binaries.
    - '!**/node_modules/naudiodon/{src,scratch,portaudio,binding.gyp}{,/**/*}'
    - '!**/node_modules/segfault-handler/{src,binding.gyp,example.js}{,/**/*}'
    - '!**/node_modules/onnxruntime-node/{lib,script}{,/**/*}'
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64
    - target: dir
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # CI overrides this to true after verifying all Apple signing secrets.
  notarize: false
  extendInfo:
    NSMicrophoneUsageDescription: "VocaLume needs microphone access for real-time speech recognition and translation."
    NSAudioCaptureUsageDescription: "VocaLume needs system audio access when you choose to translate computer audio."
win:
  extraResources:
    - from: 'build/haas-ja-win'
      to: 'haas-ja'
      filter:
        - 'speech.exe'
        - 'speech.dll'
        - 'haas-q8.gguf'
        - '*.txt'
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  files:
    - *compiledApp
    - *appManifest
    - *excludeBenchScripts
    - *excludeBenchOutput
    - *excludeDevOutput
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}{,/**/*}'
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/win32/!(${arch}){,/**/*}'
    - '!**/node_modules/@kutalia/whisper-node-addon/dist/{darwin-*,linux-*,mac-*}{,/**/*}'
    - '!**/node_modules/@kutalia/whisper-node-addon/dist/{win,win32}-!(${arch}){,/**/*}'
    - '!**/node_modules/@node-llama-cpp/{linux-*,mac-*,win-!(${arch}|${arch}-*)}{,/**/*}'
    # Windows runs prebuilt llama bindings and never compiles llama.cpp locally.
    - '!**/node_modules/node-llama-cpp/llama/{gitRelease.bundle,CMakeLists.txt}'
    - '!**/node_modules/node-llama-cpp/llama/{addon,cmake,toolchains,xpack}{,/**/*}'
    - '!**/node_modules/@node-llama-cpp/win-*/bins/**/*.{lib,exp,pdb}'
    # Main-process Transformers and Kokoro select the Node exports.
    # The renderer's compiled VAD and DeepFilter assets remain in out/renderer.
    - '!**/node_modules/onnxruntime-web{,/**/*}'
    - '!**/node_modules/{@protobufjs/*,flatbuffers,guid-typescript,long,platform,protobufjs}{,/**/*}'
    - '!**/node_modules/@huggingface/transformers/dist/{transformers,transformers.min,transformers.web,transformers.web.min}.js{,.map}'
    - '!**/node_modules/@huggingface/transformers/dist/ort-wasm-*.{mjs,wasm}'
    - '!**/node_modules/kokoro-js/dist/kokoro.web.js'
    - '!**/node_modules/deepfilternet3-noise-filter{,/**/*}'
    # Windows routes the virtual microphone through the selected renderer output.
    - '!**/node_modules/{naudiodon,segfault-handler}{,/**/*}'
  asarUnpack:
    - 'node_modules/@kutalia/whisper-node-addon/**'
    - 'node_modules/node-llama-cpp/**'
    - 'node_modules/sherpa-onnx*/**'
linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Utility
  # Retain the existing Linux extra-resource set.
  extraResources:
    - *appleBridgeResources
  files:
    - *compiledApp
    - *appManifest
    - *excludeBenchScripts
    - *excludeBenchOutput
    - *excludeDevOutput
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}{,/**/*}'
    - '!**/node_modules/onnxruntime-node/bin/napi-v3/linux/!(${arch}){,/**/*}'
    - '!**/node_modules/@kutalia/whisper-node-addon/dist/{darwin-*,mac-*,win-*,win32-*}{,/**/*}'
    - '!**/node_modules/@kutalia/whisper-node-addon/dist/linux-!(${arch}){,/**/*}'
  asarUnpack:
    - 'node_modules/@kutalia/whisper-node-addon/**'
    - 'node_modules/node-llama-cpp/**'
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
beforePack: scripts/before-pack.cjs
afterPack: scripts/after-pack.js
